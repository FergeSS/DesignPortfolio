name: Update portfolio and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 01:17 UTC = 04:17 Europe/Moscow, once a day.
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Download current content and build
        run: npm run refresh
        env:
          YANDEX_DISK_PUBLIC_URL: ${{ vars.YANDEX_DISK_PUBLIC_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
